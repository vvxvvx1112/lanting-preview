<!DOCTYPE html>
<meta charset="UTF-8">
<title>兰亭荟运营后台</title>
<style>
  /* ============ 设计变量（新中式国风 · 绛红 / 描金 / 墨色 / 宣纸） ============ */
  :root {
    --ground: #F7F3EA;
    --card: #FBF8F1;
    --card-hover: #F5EFE3;
    --ink: #26221E;
    --ink-2: #5A534A;
    --muted: #8B8174;
    --faint: #B9B0A2;
    --line: #E8DFCE;
    --line-soft: #F0E9DB;
    --brand: #8C2B24;
    --brand-deep: #6B1F1A;
    --brand-soft: #F3DFDA;
    --gold: #C0A062;
    --gold-light: #D8C08C;
    --gold-ink: #8A6D34;
    --gold-soft: #F0E6D0;
    --teal: #3C5A5A;
    --teal-soft: #E4EDEB;
    --track: #EFE7D6;
    --sidebar-bg: #1C1916;
    --sidebar-bg2: #141210;
    --sidebar-text: #EDE6DA;
    --sidebar-muted: rgba(237, 230, 218, .55);
    --sidebar-border: rgba(192, 160, 98, .25);
    --sidebar-active: rgba(192, 160, 98, .12);
    --tooltip-bg: #26221E;
    --tooltip-text: #EDE6DA;
    --serif: "STKaiti", "KaiTi", "FangSong", "SimSun", serif;
    --sans: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #16130F;
      --card: #201C17;
      --card-hover: #2A241E;
      --ink: #EDE6DA;
      --ink-2: #C6BBA9;
      --muted: #9A9082;
      --faint: #6E6558;
      --line: #3A342C;
      --line-soft: #2E2922;
      --brand: #C05A4E;
      --brand-deep: #A84A40;
      --brand-soft: #4A2722;
      --gold: #C9A96B;
      --gold-light: #D4B97E;
      --gold-ink: #D4B97E;
      --gold-soft: #3A3220;
      --teal: #7A9C9C;
      --teal-soft: #243534;
      --track: #2E2922;
      --sidebar-bg: #0F0D0B;
      --sidebar-bg2: #0A0908;
      --sidebar-muted: rgba(237, 230, 218, .5);
      --sidebar-border: rgba(201, 169, 107, .3);
      --sidebar-active: rgba(201, 169, 107, .16);
      --tooltip-bg: #EDE6DA;
      --tooltip-text: #16130F;
    }
  }
  :root[data-theme="dark"] {
    --ground: #16130F;
    --card: #201C17;
    --card-hover: #2A241E;
    --ink: #EDE6DA;
    --ink-2: #C6BBA9;
    --muted: #9A9082;
    --faint: #6E6558;
    --line: #3A342C;
    --line-soft: #2E2922;
    --brand: #C05A4E;
    --brand-deep: #A84A40;
    --brand-soft: #4A2722;
    --gold: #C9A96B;
    --gold-light: #D4B97E;
    --gold-ink: #D4B97E;
    --gold-soft: #3A3220;
    --teal: #7A9C9C;
    --teal-soft: #243534;
    --track: #2E2922;
    --sidebar-bg: #0F0D0B;
    --sidebar-bg2: #0A0908;
    --sidebar-muted: rgba(237, 230, 218, .5);
    --sidebar-border: rgba(201, 169, 107, .3);
    --sidebar-active: rgba(201, 169, 107, .16);
    --tooltip-bg: #EDE6DA;
    --tooltip-text: #16130F;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--sans);
    background: var(--ground);
    color: var(--ink);
    display: flex;
    min-height: 100vh;
    font-size: 14px;
  }

  /* 侧边栏 */
  .sidebar {
    width: 220px;
    background: linear-gradient(180deg, var(--sidebar-bg), var(--sidebar-bg2));
    color: var(--sidebar-text);
    padding: 28px 0;
    flex-shrink: 0;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .logo { display: flex; align-items: center; gap: 12px; padding: 0 24px 24px; border-bottom: 1px solid var(--sidebar-border); }
  .logo-seal {
    width: 44px; height: 44px; border: 2px solid var(--gold); border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); color: var(--gold); font-size: 22px; transform: rotate(-6deg);
  }
  .logo-text { font-family: var(--serif); font-size: 20px; letter-spacing: 2px; }
  .logo-sub { font-size: 11px; color: var(--sidebar-muted); margin-top: 2px; }
  .nav { margin-top: 16px; }
  .nav-item {
    display: flex; align-items: center; gap: 12px; padding: 13px 24px; cursor: pointer;
    color: var(--sidebar-muted); font-size: 14px; border-left: 3px solid transparent; transition: all .15s;
  }
  .nav-item:hover { background: rgba(255,255,255,.05); }
  .nav-item.active { background: var(--sidebar-active); color: var(--gold-light); border-left-color: var(--gold); }
  .nav-icon { font-family: var(--serif); width: 20px; text-align: center; }

  /* 主区 */
  .main { flex: 1; padding: 24px 28px 40px; min-width: 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .topbar-title { font-family: var(--serif); font-size: 22px; letter-spacing: 1px; }
  .topbar-user { display: flex; align-items: center; gap: 10px; }
  .role-chip { font-size: 12px; color: var(--gold-ink); background: var(--gold-soft); border: 1px solid var(--gold-light); border-radius: 999px; padding: 3px 12px; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, #E9D3A8, #C0A062); color: #6B1F1A;
    display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-weight: 600;
  }

  .view { display: none; }
  .view.active { display: block; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .card-title { font-family: var(--serif); font-size: 16px; letter-spacing: 1px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .card-title::before { content: ""; width: 4px; height: 16px; background: linear-gradient(180deg, var(--brand), var(--gold)); border-radius: 2px; }

  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .kpi-label { font-size: 13px; color: var(--muted); }
  .kpi-value { font-size: 30px; font-weight: 700; color: var(--brand); margin: 8px 0 4px; font-variant-numeric: tabular-nums; }
  .kpi-delta { font-size: 12px; color: var(--teal); }
  .kpi-delta.down { color: var(--muted); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .grid-2, .kpi-grid { grid-template-columns: 1fr; } }

  /* 图表 */
  .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .bar-label { width: 96px; text-align: right; font-size: 13px; color: var(--ink-2); flex-shrink: 0; }
  .bar-track { flex: 1; height: 22px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; background: var(--brand); }
  .bar-value { width: 44px; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

  .legend { display: flex; gap: 20px; margin-bottom: 16px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; }

  .axis-label { fill: var(--muted); font-size: 11px; }
  .bar-grant { fill: var(--brand); }
  .bar-spend { fill: var(--gold); }

  /* 表格 */
  .tbl { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 12px; border-bottom: 1px solid var(--line-soft); color: var(--ink-2); }
  tr:hover td { background: var(--card-hover); }
  .tag { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 6px; }
  .tag-red { color: var(--brand); background: var(--brand-soft); }
  .tag-gold { color: var(--gold-ink); background: var(--gold-soft); }
  .tag-teal { color: var(--teal); background: var(--teal-soft); }
  .tag-gray { color: var(--muted); background: var(--line-soft); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; height: 32px; padding: 0 16px;
    border-radius: 16px; font-size: 13px; cursor: pointer; border: none; transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }
  .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .btn-primary { background: linear-gradient(135deg, var(--brand), var(--brand-deep)); color: #F7E8D8; }
  .btn-ghost { background: transparent; border: 1px solid var(--brand); color: var(--brand); }
  .btn-gold { background: linear-gradient(135deg, var(--gold-light), var(--gold)); color: #4A3414; }

  .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .search {
    flex: 1; min-width: 200px; max-width: 320px; height: 34px; padding: 0 14px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--card); font-size: 13px; color: var(--ink);
  }
  .search:focus { outline: none; border-color: var(--gold); }

  .empty-note { text-align: center; color: var(--muted); padding: 40px 0; }

  .tooltip {
    position: fixed; pointer-events: none; z-index: 99;
    background: var(--tooltip-bg); color: var(--tooltip-text); font-size: 12px;
    padding: 6px 12px; border-radius: 6px; opacity: 0; transition: opacity .12s;
  }

  /* 手机端：侧边栏变为顶部横向导航 */
  @media (max-width: 768px) {
    body { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: static; padding: 16px 0 0; }
    .logo { border-bottom: none; padding-bottom: 12px; }
    .nav { display: flex; overflow-x: auto; margin-top: 4px; }
    .nav-item { border-left: none; border-bottom: 3px solid transparent; white-space: nowrap; }
    .nav-item.active { border-bottom-color: var(--gold); border-left-color: transparent; background: transparent; }
    .main { padding: 16px 16px 32px; }
  }
</style>

<aside class="sidebar">
  <div class="logo">
    <div class="logo-seal">兰</div>
    <div>
      <div class="logo-text">兰亭荟</div>
      <div class="logo-sub">运营管理后台</div>
    </div>
  </div>
  <nav class="nav">
    <div class="nav-item active" data-view="dashboard"><span class="nav-icon">总</span>数据概览</div>
    <div class="nav-item" data-view="members"><span class="nav-icon">会</span>会员管理</div>
    <div class="nav-item" data-view="events"><span class="nav-icon">集</span>活动管理</div>
    <div class="nav-item" data-view="verify"><span class="nav-icon">核</span>权益核销</div>
    <div class="nav-item" data-view="content"><span class="nav-icon">文</span>内容管理</div>
    <div class="nav-item" data-view="report"><span class="nav-icon">报</span>数据报表</div>
  </nav>
</aside>

<main class="main">
  <header class="topbar">
    <div class="topbar-title">数据概览</div>
    <div class="topbar-user"><span class="role-chip">超级管理员</span><div class="avatar">管</div></div>
  </header>

  <section id="dashboard" class="view active">
    <div class="kpi-grid" id="kpiGrid"></div>
    <div class="grid-2">
      <div class="card">
        <div class="card-title">各类型活动热度</div>
        <div id="activityHeat"></div>
      </div>
      <div class="card">
        <div class="card-title">会员等级分布</div>
        <div id="levelDist"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">待核销记录（最近）</div>
      <div id="recentVoucher"></div>
    </div>
  </section>

  <section id="members" class="view">
    <div class="toolbar">
      <input class="search" id="memberSearch" placeholder="搜索姓名 / 企业 / 手机号" oninput="filterMembers()">
      <button class="btn btn-primary" onclick="toast('已导出会员名单（演示）')">导出名单</button>
    </div>
    <div class="card"><div id="memberTable"></div></div>
  </section>

  <section id="events" class="view">
    <div class="toolbar">
      <input class="search" placeholder="搜索活动名称" oninput="toast('筛选（演示）')">
      <button class="btn btn-primary" onclick="toast('新建活动（演示）')">+ 新建活动</button>
    </div>
    <div class="card"><div id="eventTable"></div></div>
  </section>

  <section id="verify" class="view">
    <div class="toolbar">
      <input class="search" placeholder="扫码 / 输入核销码" oninput="toast('核销查询（演示）')">
      <button class="btn btn-gold" onclick="toast('调起扫码（演示）')">扫码核销</button>
    </div>
    <div class="card"><div id="voucherTable"></div></div>
  </section>

  <section id="content" class="view">
    <div class="toolbar">
      <button class="btn btn-primary" onclick="toast('新建内容（演示）')">+ 新建内容</button>
      <button class="btn btn-ghost" onclick="toast('已上架（演示）')">定时发布</button>
    </div>
    <div class="card"><div id="contentTable"></div></div>
  </section>

  <section id="report" class="view">
    <div class="card">
      <div class="card-title">积分发放 / 消耗（近 6 个月）</div>
      <div class="legend">
        <div class="legend-item"><span class="legend-dot" style="background:var(--brand)"></span>积分发放</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--gold)"></span>积分消耗</div>
      </div>
      <div id="pointsChart"></div>
    </div>
    <div class="card">
      <div class="card-title">运营报表</div>
      <button class="btn btn-primary" onclick="toast('已生成周报并导出 Excel（演示）')">导出 Excel 报表</button>
    </div>
  </section>
</main>

<div class="tooltip" id="tooltip"></div>

<script>
  const MOCK = {
    stats: [
      { label: '本月新增会员', value: 128, delta: '较上月 +12.4%' },
      { label: '活动报名总数', value: 342, delta: '较上月 +8.1%' },
      { label: '平均到场率', value: '87%', delta: '较上月 +2.3%' },
      { label: '本月权益核销', value: 256, delta: '较上月 -3.6%', down: true }
    ],
    activityHeat: [
      { name: '品鉴会', value: 96 }, { name: '兰亭雅宴', value: 84 },
      { name: '高尔夫赛事', value: 72 }, { name: '名家文化沙龙', value: 58 },
      { name: '兰亭雅集', value: 47 }, { name: '主题活动', value: 39 }
    ],
    levelDist: [
      { name: '普通会员', value: 3200 }, { name: 'VIP会员', value: 1560 },
      { name: 'SVIP会员', value: 680 }, { name: '兰VVIP会员', value: 160 }
    ],
    members: [
      { name: '陈先生', phone: '138****8888', company: '会稽山·战略合作伙伴', level: 'SVIP会员', tag: 'tag-gold', joined: '2026-04-27', active: '高' },
      { name: '李女士', phone: '139****2211', company: '江南文创集团', level: '兰VVIP会员', tag: 'tag-red', joined: '2026-03-12', active: '高' },
      { name: '王总', phone: '137****5566', company: '浙商企业家俱乐部', level: 'VIP会员', tag: 'tag-gold', joined: '2026-05-30', active: '中' },
      { name: '赵先生', phone: '136****9034', company: '私人收藏家', level: '普通会员', tag: 'tag-gray', joined: '2026-08-01', active: '中' },
      { name: '孙女士', phone: '135****7788', company: '高端餐饮主理人', level: 'SVIP会员', tag: 'tag-gold', joined: '2026-06-18', active: '高' },
      { name: '周先生', phone: '134****6622', company: '高尔夫俱乐部', level: 'VIP会员', tag: 'tag-gold', joined: '2026-07-09', active: '中' }
    ],
    events: [
      { name: '秋季高尔夫邀请赛', type: '高尔夫赛事', status: '报名中', tag: 'tag-red', signed: '42/60', date: '2026-10-18' },
      { name: '金风玉露兰亭雅宴', type: '兰亭雅宴', status: '已满员', tag: 'tag-gold', signed: '30/30', date: '2026-09-23' },
      { name: '陈年黄酒大师品鉴会', type: '品鉴会', status: '报名中', tag: 'tag-red', signed: '21/40', date: '2026-09-28' },
      { name: '兰亭书道·文化沙龙', type: '名家文化沙龙', status: '已满员', tag: 'tag-gold', signed: '20/20', date: '2026-09-20' },
      { name: '中秋团圆雅集', type: '主题活动', status: '回顾', tag: 'tag-teal', signed: '50/50', date: '2026-09-06' },
      { name: '冬日温补·兰亭雅集', type: '兰亭雅集', status: '预告中', tag: 'tag-gray', signed: '0/35', date: '2026-11-08' }
    ],
    vouchers: [
      { code: 'LT-2026-0923-0001', item: '兰亭雅宴·秋分宴', holder: '陈先生', status: '待核销', tag: 'tag-red', time: '2026-09-16' },
      { code: 'LT-2026-0920-0008', item: '限定品鉴小酒', holder: '李女士', status: '待核销', tag: 'tag-red', time: '2026-09-15' },
      { code: 'LT-2026-0912-0015', item: '节气伴手礼·秋分', holder: '王总', status: '待核销', tag: 'tag-red', time: '2026-09-14' },

    ],
    contents: [
      { title: '秋分·金风玉露兰亭雅宴', type: '活动', status: '已上架', tag: 'tag-teal', author: '品牌运营', time: '2026-09-10' },
      { title: '陈年黄酒大师品鉴会', type: '活动', status: '已上架', tag: 'tag-teal', author: '品牌运营', time: '2026-09-08' },
      { title: '酿酒工艺 · 会稽山酿造流程', type: '文化', status: '已上架', tag: 'tag-teal', author: '内容运营', time: '2026-09-01' },
      { title: '秋季润燥·餐酒搭配指南', type: '文化', status: '待发布', tag: 'tag-gold', author: '内容运营', time: '2026-09-15' }
    ],
    points: [
      { month: '4月', grant: 32000, spend: 21000 }, { month: '5月', grant: 41000, spend: 26000 },
      { month: '6月', grant: 48000, spend: 31000 }, { month: '7月', grant: 45000, spend: 35000 },
      { month: '8月', grant: 52000, spend: 38000 }, { month: '9月', grant: 61000, spend: 44000 }
    ]
  };

  function renderKpi() {
    document.getElementById('kpiGrid').innerHTML = MOCK.stats.map(s => `
      <div class="kpi"><div class="kpi-label">${s.label}</div><div class="kpi-value">${s.value}</div><div class="kpi-delta ${s.down ? 'down' : ''}">${s.delta}</div></div>`).join('');
  }

  function renderBars(elId, data) {
    const max = Math.max(...data.map(d => d.value));
    document.getElementById(elId).innerHTML = data.map(d => `
      <div class="bar-row">
        <div class="bar-label">${d.name}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(d.value / max * 100).toFixed(1)}%"
             onmouseenter="showTip(event,'${d.name}：${d.value}')" onmousemove="moveTip(event)" onmouseleave="hideTip()"></div></div>
        <div class="bar-value">${d.value.toLocaleString()}</div>
      </div>`).join('');
  }

  function renderMembers(list) {
    const rows = list.map(m => `<tr><td><strong style="color:var(--ink)">${m.name}</strong></td><td>${m.phone}</td><td>${m.company}</td><td><span class="tag ${m.tag}">${m.level}</span></td><td>${m.joined}</td><td>${m.active}</td></tr>`).join('');
    document.getElementById('memberTable').innerHTML = `<div class="tbl"><table><tr><th>姓名</th><th>手机号</th><th>所属企业</th><th>等级</th><th>入会时间</th><th>活跃度</th></tr>${rows}</table></div>`;
  }
  function renderEvents() {
    const rows = MOCK.events.map(e => `<tr><td><strong style="color:var(--ink)">${e.name}</strong></td><td>${e.type}</td><td><span class="tag ${e.tag}">${e.status}</span></td><td>${e.signed}</td><td>${e.date}</td><td><button class="btn btn-ghost" onclick="toast('编辑活动（演示）')">编辑</button></td></tr>`).join('');
    document.getElementById('eventTable').innerHTML = `<div class="tbl"><table><tr><th>活动名称</th><th>类型</th><th>状态</th><th>报名</th><th>日期</th><th>操作</th></tr>${rows}</table></div>`;
  }
  function renderVouchers() {
    const rows = MOCK.vouchers.map(v => {
      const btn = v.status === '待核销' ? `<button class="btn btn-gold" onclick="toast('已核销 ${v.code}（演示）')">核销</button>`
        : `<button class="btn btn-ghost" disabled style="opacity:.5">已核销</button>`;
      return `<tr><td><strong style="color:var(--ink)">${v.code}</strong></td><td>${v.item}</td><td>${v.holder}</td><td><span class="tag ${v.tag}">${v.status}</span></td><td>${v.time}</td><td>${btn}</td></tr>`;
    }).join('');
    document.getElementById('voucherTable').innerHTML = `<div class="tbl"><table><tr><th>核销码</th><th>兑换物品</th><th>持有人</th><th>状态</th><th>时间</th><th>操作</th></tr>${rows}</table></div>`;
    const recent = MOCK.vouchers.filter(v => v.status === '待核销').slice(0, 3);
    document.getElementById('recentVoucher').innerHTML = recent.length
      ? `<div class="tbl"><table><tr><th>核销码</th><th>兑换物品</th><th>持有人</th><th>状态</th></tr>` +
        recent.map(v => `<tr><td>${v.code}</td><td>${v.item}</td><td>${v.holder}</td><td><span class="tag ${v.tag}">${v.status}</span></td></tr>`).join('') + `</table></div>`
      : `<div class="empty-note">暂无待核销记录</div>`;
  }
  function renderContents() {
    const rows = MOCK.contents.map(c => `<tr><td><strong style="color:var(--ink)">${c.title}</strong></td><td>${c.type}</td><td><span class="tag ${c.tag}">${c.status}</span></td><td>${c.author}</td><td>${c.time}</td><td><button class="btn btn-ghost" onclick="toast('编辑内容（演示）')">编辑</button></td></tr>`).join('');
    document.getElementById('contentTable').innerHTML = `<div class="tbl"><table><tr><th>内容标题</th><th>类型</th><th>状态</th><th>发布人</th><th>时间</th><th>操作</th></tr>${rows}</table></div>`;
  }
  function renderPointsChart() {
    const max = Math.max(...MOCK.points.flatMap(p => [p.grant, p.spend]));
    const gap = 6, barW = 30, chartW = (barW * 2 + gap) * MOCK.points.length, h = 200;
    let bars = '';
    MOCK.points.forEach((p, i) => {
      const x0 = i * (barW * 2 + gap), gH = (p.grant / max) * (h - 30), sH = (p.spend / max) * (h - 30);
      bars += `<rect class="bar-grant" x="${x0}" y="${h - gH}" width="${barW}" height="${gH}" rx="3"
        onmouseenter="showTip(event,'${p.month} 发放：${p.grant.toLocaleString()}')" onmousemove="moveTip(event)" onmouseleave="hideTip()"></rect>
        <rect class="bar-spend" x="${x0 + barW + gap}" y="${h - sH}" width="${barW}" height="${sH}" rx="3"
        onmouseenter="showTip(event,'${p.month} 消耗：${p.spend.toLocaleString()}')" onmousemove="moveTip(event)" onmouseleave="hideTip()"></rect>
        <text class="axis-label" x="${x0 + barW + gap/2}" y="${h + 16}" text-anchor="middle">${p.month}</text>`;
    });
    document.getElementById('pointsChart').innerHTML = `<div class="tbl"><svg viewBox="0 0 ${chartW} ${h + 26}" width="100%" height="${h + 26}">${bars}</svg></div>`;
  }

  function switchView(name) {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === name));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(name).classList.add('active');
    const titles = { dashboard: '数据概览', members: '会员管理', events: '活动管理', verify: '权益核销', content: '内容管理', report: '数据报表' };
    document.querySelector('.topbar-title').textContent = titles[name] || '数据概览';
  }
  document.querySelectorAll('.nav-item').forEach(n => n.addEventListener('click', () => switchView(n.dataset.view)));

  function filterMembers() {
    const kw = document.getElementById('memberSearch').value.trim();
    renderMembers(kw ? MOCK.members.filter(m => (m.name + m.company + m.phone).includes(kw)) : MOCK.members);
  }
  function toast(msg) {
    const el = document.createElement('div');
    el.textContent = msg;
    Object.assign(el.style, { position: 'fixed', bottom: '32px', left: '50%', transform: 'translateX(-50%)',
      background: 'var(--tooltip-bg)', color: 'var(--tooltip-text)', padding: '10px 20px', borderRadius: '8px',
      fontSize: '13px', zIndex: 999, transition: 'opacity .3s' });
    document.body.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 1600);
  }

  const tip = document.getElementById('tooltip');
  function showTip(e, text) { tip.textContent = text; tip.style.opacity = '1'; moveTip(e); }
  function moveTip(e) { tip.style.left = (e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; }
  function hideTip() { tip.style.opacity = '0'; }

  renderKpi();
  renderBars('activityHeat', [...MOCK.activityHeat].sort((a, b) => b.value - a.value));
  renderBars('levelDist', MOCK.levelDist);
  renderMembers(MOCK.members);
  renderEvents();
  renderVouchers();
  renderContents();
  renderPointsChart();
</script>
